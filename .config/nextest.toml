# cargo-nextest configuration.
#
# `default` is used for local runs. `ci` is opted into via `--profile ci`: it
# keeps going past the first failure, retries flaky tests, and emits JUnit XML.
#
# Run with mold linking via:  pixi run -e dev test
# or directly:                cargo nextest run

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
retries = 2
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
