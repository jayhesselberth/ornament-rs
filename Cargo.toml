[workspace]
resolver = "2"
members = [
    "crates/ornament-alphabet",
    "crates/ornament-stats",
    "crates/ornament-hmm",
    "crates/ornament-gpu",
    "crates/ornament-scfg",
    "crates/ornament-core",
    "crates/ornament-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
authors = ["Jay Hesselberth"]
repository = "https://github.com/jayhesselberth/ornament"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Terminal UX (CLI presentation layer)
owo-colors = "4"
indicatif = "0.18"
tabled = { version = "0.21", features = ["ansi"] }

# Structured logging (status output via the tracing facade)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Performance
rustc-hash = "1"

# Utilities
lazy_static = "1"
regex = "1"
tempfile = "3"

# Bioinformatics
bio = "1"
noodles-fasta = "0.62"

# Compression (transparent .gz reading; pure-Rust miniz_oxide backend, no C toolchain)
flate2 = "1"

# Parallelism
rayon = "1"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Internal crates
ornament-alphabet = { path = "crates/ornament-alphabet" }
ornament-stats = { path = "crates/ornament-stats" }
ornament-hmm = { path = "crates/ornament-hmm" }
ornament-scfg = { path = "crates/ornament-scfg" }
ornament-core = { path = "crates/ornament-core" }

# Fast dev builds, but with optimized third-party crates so the numeric DP and
# differential tests run at a reasonable speed.
[profile.dev.package."*"]
opt-level = 2

# Pin release codegen here so benchmarks measure what ships.
[profile.bench]
inherits = "release"
strip = false

# Optimized release build: LTO + single codegen unit for maximum performance of
# the CYK/Inside DP and SIMD kernels.
[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

# Profiling build: drops LTO and splits codegen so frames aren't inlined away
# from profilers (perf, samply, valgrind). Slower than release, faithful graphs.
[profile.profiling]
inherits = "release"
debug = 2
split-debuginfo = "packed"
strip = false
lto = false
codegen-units = 16

# Release-speed build with symbols preserved, for samply/perf recordings.
[profile.release-with-debug]
inherits = "release"
debug = 2
split-debuginfo = "packed"
strip = false
