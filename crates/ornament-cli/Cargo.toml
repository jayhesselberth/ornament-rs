[package]
name = "ornament-cli"
description = "Modification-aware tRNA scanner CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ornament"
path = "src/main.rs"

[features]
# GPU-accelerated scan filtering (propagates to ornament-scfg's `cuda`). Build with
# `--features cuda` on a CUDA node; enable at runtime with `ORNAMENT_GPU=1` (or the pipeline flag).
cuda = ["ornament-core/cuda"]

[dependencies]
ornament-core = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }

# Terminal UX
owo-colors = { workspace = true }
indicatif = { workspace = true }
tabled = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
