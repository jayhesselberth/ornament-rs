[package]
name = "hmmer-rs"
description = "Native Rust port of the HMMER p7 profile + MSV/Viterbi/Forward filters used as Infernal's CM acceleration filter. (Scaffolding; implemented in Phase 5.)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Only the explicit criterion benches below should run under `cargo bench`; disable the
# default libtest bench harness (which doesn't accept criterion's CLI args).
bench = false

[dependencies]
easel-rs = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "p7_filters"
harness = false
