[package]
name = "ornament-scfg"
description = "Covariance-model (profile-SCFG) search engine: .cm parser, CYK/Inside DP, alignment, tophits, and E-values."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Only the explicit criterion bench below runs under `cargo bench`; disable the default
# libtest bench harness (which doesn't accept criterion's CLI args).
bench = false

[dependencies]
ornament-alphabet = { workspace = true }
ornament-hmm = { workspace = true }
ornament-gpu = { workspace = true, optional = true }
thiserror = { workspace = true }
rayon = { workspace = true }
flate2 = { workspace = true }

[features]
# GPU-accelerated MSV prefilter (CUDA). Off by default so the workspace builds without a CUDA
# toolchain; enabling it pulls in ornament-gpu's `cuda` feature (nvcc + libcudart). The final
# hits are unchanged — GPU MSV is bit-parity-equal to the CPU MSV filter it replaces.
cuda = ["dep:ornament-gpu", "ornament-gpu/cuda"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "cm_search"
harness = false
