[workspace]
name = "ornament-rs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# Infernal provides the `cmsearch`/`cmstat`/`cmemit` binaries used as the
# differential-testing oracle for the native port (skip-gated in tests).
infernal = ">=1.1.5"

# Fast local dev builds via mold. The task wrappers use `mold -run`, which
# intercepts the linker exec via LD_PRELOAD and works with the system gcc on the
# compute nodes — no `-fuse-ld=mold` support required, and no global linker
# override in .cargo/config.toml. CI release binaries build against musl with
# their own flags and are unaffected.
[feature.dev.dependencies]
mold = ">=2.4"
cargo-nextest = ">=0.9"

[feature.dev.tasks]
build = "mold -run cargo build"
build-rel = "mold -run cargo build --release"
# nextest does not run doctests; use test-doc for those.
test = "mold -run cargo nextest run"
test-doc = "mold -run cargo test --doc"
check = "mold -run cargo check"
clippy = "mold -run cargo clippy --workspace --all-targets"

[environments]
dev = { features = ["dev"], solve-group = "default" }
